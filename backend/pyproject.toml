[project]
name = "insync-backend"
version = "0.0.0"
requires-python = "==3.12.14"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
required-version = "==0.12.19"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
